<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岐阜の観光スポット</title>
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">gifu NAVI</a>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main>
        <h1 class="page-title">おすすめ観光スポット</h1>
        <p class="page-description">人気の観光地をご紹介します。気になるスポットの詳細ページをご覧ください。</p>

        <!-- カード一覧 -->
        <div class="spot-grid">
            
            <!-- スポット 1 (spot-a.html へ移動) -->
            <div class="spot-card">
                <div class="spot-image-container">
                    <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=800&q=80" alt="伏見稲荷大社" class="spot-image">
                    <span class="spot-badge">岐阜県 / 山県市</span>
                </div>
                <div class="spot-content">
                    <h2 class="spot-title">グリーンプラザ美山</h2>
                    <p class="spot-text">全国に約3万社あるといわれる稲荷神社の総本宮。朱塗りの鳥居が延々と続く「千本鳥居」は圧巻の景色です。</p>
                    <div class="spot-footer">
                        <a href="spot-a.html" class="btn">詳細を見る &rarr;</a>
                    </div>
                </div>
            </div>

            <!-- スポット 2 (spot-b.html へ移動) -->
            <div class="spot-card">
                <div class="spot-image-container">
                    <img src="https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=800&q=80" alt="新倉山浅間公園" class="spot-image">
                    <span class="spot-badge"岐阜県 / 美濃加茂市 </span>
                </div>
                <div class="spot-content">
                    <h2 class="spot-title">美濃加茂健康の森</h2>
                    <p class="spot-text">五重塔と富士山、そして四季折々の自然が一望できる絶景スポット。特に春の桜の季節は世界中から人が訪れます。</p>
                    <div class="spot-footer">
                        <a href="spot-b.html" class="btn">詳細を見る &rarr;</a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- フッター -->
    <footer>
        <p>&copy; JAPAN TRAVEL NAVI</p>
    </footer>

</body>
</html>
