<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岐阜の観光スポット</title>
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー -->
    <header>
    <div class="header-container">
        <a href="index.html" class="logo">
            <img src="./images/アートボード 1@4x.png" alt="Gifu NAVI ロゴ">
        </a>
    </div>
</header>

    <!-- メインコンテンツ -->
    <main>
        <h1 class="page-title">岐阜の観光・おすすめスポット</h1>
        <p class="page-description">観光・おすすめスポットを紹介しています。</p>

        <!-- カード一覧 -->
        <div class="spot-grid">
            
            <!-- スポット 1 (spot-a.html へ移動) -->
            <div class="spot-card">
                <div class="spot-image-container">
                    <img src="./images/スクリーンショット 2026-10-21 114951.png" alt="伏見稲荷大社" class="spot-image">
                    <span class="spot-badge">岐阜県 / 岐阜市</span>
                </div>
                <div class="spot-content">
                    <h2 class="spot-title">Vice Vice</h2>
                    <p class="spot-text">岐阜市芥見にある喫茶店です。人気メニューとして、トーストやパンケーキ、大きいサイズのジュースなどがあります。</p>
                    <div class="spot-footer">
                        <a href="spot-a.html" class="btn">詳細を見る &rarr;</a>
                    </div>
                </div>
            </div>

            <!-- スポット 2 (spot-b.html へ移動) -->
            <div class="spot-card">
                <div class="spot-image-container">
                    <img src="https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=800&q=80" alt="新倉山浅間公園" class="spot-image">
                    <span class="spot-badge">岐阜県 / 美濃加茂市 </span>
                </div>
                <div class="spot-content">
                    <h2 class="spot-title">美濃加茂健康の森</h2>
                    <p class="spot-text">美濃加茂市北部の里山の中にあり、あじさいをはじめ、野鳥や季節の草花を楽しむことができる自然豊かな森林公園です。</p>
                    <div class="spot-footer">
                        <a href="spot-b.html" class="btn">詳細を見る &rarr;</a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- フッター -->
    <footer>
        <p>&copy; Gifu NAVI</p>
    </footer>

</body>
</html>
