<!DOCTYPE html>

<body>

    <!-- ヘッダー -->
    <header>
    <div class="header-container">
        <a href="index.html" class="logo">
            <img src="./images/アートボード 1@4x.png" alt="Gifu NAVI ロゴ">
        </a>
    </div>
</header>

    <!-- メインコンテンツ -->
    <main>
        <!-- 戻るボタン -->
        <p style="margin-bottom: 15px;">
            <a href="index.html" style="color: #008080; text-decoration: none; font-size: 13px; font-weight: bold;">&larr; スポット一覧に戻る</a>
        </p>

        <!-- アイキャッチ画像 -->
        <div style="width: 100%; height: 350px; background-color: #e0e0e0; border-radius: 12px; overflow: hidden; margin-bottom: 25px;">
            <img src="./images/スクリーンショット 2026-10-21 114951.png" alt="伏見稲荷大社" style="width: 100%; height: 100%; object-fit: cover;">
        </div>

        <!-- タイトル・基本情報 -->
        <span class="spot-badge" style="position: static; display: inline-block; margin-bottom: 10px;">岐阜 / 岐阜市</span>
        <h1 class="page-title" style="font-size: 28px; margin-bottom: 15px;">vice vice</h1>

        <p style="font-size: 15px; color: #444; line-height: 1.8; margin-bottom: 30px;">
            岐阜市芥見にある喫茶店です。人気メニューとして、トーストやパンケーキ、大きいサイズのジュースなどがあります。お店はこじんまりとしており、席も少なめなのでゆったり過ごせます。
        </p>

        <!-- 詳細情報テーブル -->
        <div style="background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 30px;">
            <h2 style="font-size: 16px; margin-bottom: 15px; border-bottom: 2px solid #008080; padding-bottom: 5px;">基本情報</h2>
            <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                <tr>
                    <th style="text-align: left; padding: 8px 0; border-bottom: 1px solid #f0f0f0; width: 120px; color: #666;">所在地</th>
                    <td style="padding: 8px 0; border-bottom: 1px solid #f0f0f0;">	岐阜県岐阜市芥見大船2-90</td>
                </tr>
                <tr>
                    <th style="text-align: left; padding: 8px 0; border-bottom: 1px solid #f0f0f0; color: #666;">営業時間</th>
                    <td style="padding: 8px 0; border-bottom: 1px solid #f0f0f0;">08:00 - 16:00 (定休日：水曜日)</td>
                </tr>
                <tr>
                    <th style="text-align: left; padding: 8px 0; border-bottom: 1px solid #f0f0f0; color: #666;">アクセス</th>
                    <td style="padding: 8px 0; border-bottom: 1px solid #f0f0f0;">バス停(大船東／岐阜県岐阜市)徒歩1分</td>
                </tr>
